# California: counties, batches, providers and local quirks.
# Batches are ordered largest first. The order uses 2020-census population
# as a stand-in until provider coverage data gives real listing volumes;
# re-rank by listing volume at Phase 6 step 1.
# Coverage fields stay null until the Phase 6 coverage check fills them.

state: CA
state_fips: "06"
recording_system: deed_of_trust   # liens are deeds of trust, releases are reconveyances
non_disclosure: false             # sale prices are generally available (documentary transfer tax)

doc_type_map:
  lien: ["DEED OF TRUST", "TRUST DEED", "MORTGAGE"]
  heloc: ["CREDIT LINE DEED OF TRUST", "HOME EQUITY LINE OF CREDIT", "REVOLVING CREDIT DEED OF TRUST"]
  release: ["RECONVEYANCE", "FULL RECONVEYANCE", "SUBSTITUTION OF TRUSTEE AND FULL RECONVEYANCE"]
  quitclaim: ["QUITCLAIM DEED"]
  sale: ["GRANT DEED", "CORPORATION GRANT DEED"]
  distressed: ["TRUSTEE'S DEED UPON SALE", "NOTICE OF DEFAULT", "NOTICE OF TRUSTEE'S SALE"]

providers:
  listings: null      # decided at Checkpoint 0
  records: null       # decided at Checkpoint 0
  baseline: hmda
  geocoder: census

pilot_county: null    # decided at Checkpoint 0

